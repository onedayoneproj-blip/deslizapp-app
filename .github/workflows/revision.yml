name: Revisión

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  revision:
    name: Revisión
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (typegen + tsc)
        run: npm run tipos
      - name: Pruebas
        run: npm test
      - name: Lint
        run: npm run lint
