<style>

.acc{display:flex;gap:8px}
.acc button{flex:1;height:44px;border-radius:999px;border:1.5px solid #e7dcc8;background:#fff;color:#174b3a;font:800 15px 'Figtree',sans-serif}
.estado{display:inline-flex;align-items:center;gap:6px;height:28px;border-radius:999px;background:#ffe3d6;color:#a8410f;padding:0 12px;font-size:13px;font-weight:800}
.mano{font-family:'Caveat',cursive;font-size:22px;color:#4f6a5e;margin:8px 0 4px}
.pie{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 30px;background:#fff9ee;border-top:1px solid #efe4d2}

      <div class="tarj" role="group" aria-label="Ficha técnica"><div class="th" style="align-items: flex-start"><div class="mini" aria-label="Miniatura de la ficha"><i style="width: 70%"></i><i></i><i></i><i style="width: 80%"></i><i></i><i style="width: 60%"></i></div><div><b>Ficha técnica</b><span>Se ve en tu catálogo, junto a «Ver presentaciones».</span></div></div>
<div class="acc"><button type="button">Cambiar</button><button type="button">Quitar</button></div></div>

  </div>
</div>
