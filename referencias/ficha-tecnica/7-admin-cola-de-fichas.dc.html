.it b{display:block;font-size:16px}
.it span{display:block;font-size:13px;color:#4f6a5e;margin-top:2px}
.ba{display:flex;gap:8px;margin-top:10px}
.ba button{height:40px;border-radius:999px;padding:0 14px;font:800 14px 'Figtree',sans-serif;border:1.5px solid #e7dcc8;background:#fff;color:#174b3a}
