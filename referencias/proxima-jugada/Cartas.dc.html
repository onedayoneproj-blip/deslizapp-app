<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,500..700&family=Figtree:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.raiz{color:#174b3a;font-family:'Figtree',sans-serif}
.hoja{position:relative;width:390px;background:#93a89c;overflow:hidden}
.hoja-cuerpo{position:absolute;left:0;right:0;bottom:0;top:56px;padding:10px 20px 34px;border-radius:28px 28px 0 0;background:#fff9ee;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.agarre{display:flex;justify-content:center}.agarre span{width:40px;height:5px;border-radius:999px;background:#e7dcc8}
.cab{display:flex;align-items:center;justify-content:space-between}
.cab h2{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-stretch:115%;font-size:28px}
.cerrar{width:44px;height:44px;border:none;border-radius:999px;background:#f3ead9;color:#174b3a;display:flex;align-items:center;justify-content:center}
.tj{position:relative;isolation:isolate;border-radius:24px;min-height:184px;overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.tj-txt{position:relative;z-index:3;width:56%;padding:16px 0 16px 18px;display:flex;flex-direction:column;gap:4px}
.tj-kicker{font-family:'Caveat',cursive;font-weight:700;font-size:22px;line-height:22px;color:#a8410f}
.tj-titulo{font-family:'Fredoka',sans-serif;font-weight:700;font-stretch:110%;font-size:25px;line-height:27px}
.tj-linea{font-size:14px;line-height:19px;font-weight:600;color:#36584a}
.tj-btn{margin-top:8px;align-self:flex-start;height:40px;padding:0 16px;border-radius:999px;background:#174b3a;color:#fff9ee;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.baraja{position:absolute;z-index:3;right:10px;top:50%;width:150px;height:132px;margin-top:-62px}
.carta{position:absolute;left:46px;top:26px;width:58px;height:80px;border:2.5px solid #fff9ee;border-radius:13px;overflow:hidden;box-shadow:0 8px 16px -6px rgba(23,75,58,.35);transform-origin:50% 100%}
.carta img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.c0{background:#e3eee6;transform:translate(-38px,16px) rotate(-20deg)}
.c1{background:#f9e1e9;transform:translate(-15px,-2px) rotate(-7deg)}
.c2{background:#f2e5d3;transform:translate(13px,-2px) rotate(7deg)}
.c3{background:#f8ded0;transform:translate(36px,16px) rotate(20deg)}
.grano{position:absolute;inset:0;z-index:2;pointer-events:none;background:url('img/grano.svg') repeat;background-size:180px 180px;opacity:.32;mix-blend-mode:overlay}
.nota{font-size:13px;line-height:18px;color:#4f6a5e}
/* Las tres: un ciclo de 14 s — se asoma, se recoge, baraja y se vuelve a abrir */
.m-tres .carta{animation:14s ease-in-out infinite}
.m-tres .c0{animation-name:tres0}
@keyframes tres0{0%,20%{transform:translate(-38px,16px) rotate(-20deg)}24%,27.5%{transform:translate(-46px,19px) rotate(-24deg)}31%,55%{transform:translate(-38px,16px) rotate(-20deg)}61%{transform:translate(-3px,4px) rotate(-3deg)}64%{transform:translate(-24px,2px) rotate(-8deg)}66.5%{transform:translate(-3px,4px) rotate(-3deg)}69%{transform:translate(24px,2px) rotate(8deg)}71.5%{transform:translate(-3px,4px) rotate(-3deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(-38px,16px) rotate(-20deg)}}
.m-tres .c1{animation-name:tres1}
@keyframes tres1{0%,20%{transform:translate(-15px,-2px) rotate(-7deg);z-index:0}21%{z-index:5}24%,27.5%{transform:translate(-11px,-24px) rotate(-2deg) scale(1.14);z-index:5}25.2%{transform:translate(-11px,-24px) rotate(-6deg) scale(1.14);z-index:5}26.4%{transform:translate(-11px,-24px) rotate(2deg) scale(1.14);z-index:5}30.5%{z-index:5}31%{z-index:0}31%,55%{transform:translate(-15px,-2px) rotate(-7deg)}61%{transform:translate(-1px,2px) rotate(-1deg)}64%{transform:translate(20px,-2px) rotate(6deg)}66.5%{transform:translate(-1px,2px) rotate(-1deg)}69%{transform:translate(-20px,-2px) rotate(-6deg)}71.5%{transform:translate(-1px,2px) rotate(-1deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(-15px,-2px) rotate(-7deg)}}
.m-tres .c2{animation-name:tres2}
@keyframes tres2{0%,20%{transform:translate(13px,-2px) rotate(7deg)}24%,27.5%{transform:translate(20px,1px) rotate(10deg)}31%,55%{transform:translate(13px,-2px) rotate(7deg)}61%{transform:translate(1px,0px) rotate(1deg)}64%{transform:translate(-20px,0px) rotate(-5deg)}66.5%{transform:translate(1px,0px) rotate(1deg)}69%{transform:translate(20px,0px) rotate(5deg)}71.5%{transform:translate(1px,0px) rotate(1deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(13px,-2px) rotate(7deg)}}
.m-tres .c3{animation-name:tres3}
@keyframes tres3{0%,20%{transform:translate(36px,16px) rotate(20deg)}31%,55%{transform:translate(36px,16px) rotate(20deg)}61%{transform:translate(3px,-2px) rotate(3deg)}64%{transform:translate(24px,2px) rotate(8deg)}66.5%{transform:translate(3px,-2px) rotate(3deg)}69%{transform:translate(-24px,2px) rotate(-8deg)}71.5%{transform:translate(3px,-2px) rotate(3deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(36px,16px) rotate(20deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.cartasD{background:#fff9ee}
.selector{display:flex;gap:8px;flex-wrap:wrap}
.op{padding:0 12px!important}
.op{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #e7dcc8;background:#fff;color:#174b3a;font-family:'Figtree',sans-serif;font-size:15px;font-weight:800;cursor:pointer}
.op[aria-checked="true"]{background:#dcebe2;border-color:#dcebe2}
.escena{position:relative;height:250px;border-radius:24px;background:radial-gradient(90% 80% at 70% 40%,#fde3ec,transparent 60%),radial-gradient(80% 80% at 20% 90%,#e2f2e9,transparent 60%),#fff9ee;border:1.5px solid #efe4d2;overflow:hidden}
.escena .baraja{right:50%;margin-right:-75px;transform:scale(1.35);transform-origin:50% 50%}
/* Abanico: de mazo a abanico, se sostiene, se recoge */
.m-abanico .carta{animation:7s cubic-bezier(.3,1.4,.5,1) infinite}
.m-abanico .c0{animation-name:ab0}.m-abanico .c1{animation-name:ab1;animation-delay:.06s}.m-abanico .c2{animation-name:ab2;animation-delay:.12s}.m-abanico .c3{animation-name:ab3;animation-delay:.18s}
@keyframes ab0{0%,8%,92%,100%{transform:translate(0,4px) rotate(-3deg)}22%,78%{transform:translate(-38px,16px) rotate(-20deg)}}
@keyframes ab1{0%,8%,92%,100%{transform:translate(0,2px) rotate(-1deg)}22%,78%{transform:translate(-15px,-2px) rotate(-7deg)}}
@keyframes ab2{0%,8%,92%,100%{transform:translate(0,0) rotate(1deg)}22%,78%{transform:translate(13px,-2px) rotate(7deg)}}
@keyframes ab3{0%,8%,92%,100%{transform:translate(0,-2px) rotate(3deg)}22%,78%{transform:translate(36px,16px) rotate(20deg)}}
/* Se asoma: abierto quieto; cada 5 s la de la jugada destacada se levanta y saluda */
.m-asoma .c1{animation:asoma 5s cubic-bezier(.3,1.3,.5,1) infinite;z-index:5}
.m-asoma .c0{animation:apart0 5s ease-in-out infinite}.m-asoma .c2{animation:apart2 5s ease-in-out infinite}
@keyframes asoma{0%,55%,100%{transform:translate(-15px,-2px) rotate(-7deg) scale(1)}68%,84%{transform:translate(-14px,-26px) rotate(-2deg) scale(1.14)}74%{transform:translate(-14px,-26px) rotate(-6deg) scale(1.14)}79%{transform:translate(-14px,-26px) rotate(2deg) scale(1.14)}}
@keyframes apart0{0%,55%,100%{transform:translate(-38px,16px) rotate(-20deg)}68%,84%{transform:translate(-52px,22px) rotate(-26deg)}}
@keyframes apart2{0%,55%,100%{transform:translate(13px,-2px) rotate(7deg)}68%,84%{transform:translate(20px,0) rotate(11deg)}}
/* Barajar: la de delante sale y se va al fondo */
.m-barajar .carta{animation:8s cubic-bezier(.5,0,.3,1) infinite}
.m-barajar .c3{animation-name:bj3}.m-barajar .c2{animation-name:bj2}.m-barajar .c1{animation-name:bj1}.m-barajar .c0{animation-name:bj0}
@keyframes bj3{0%,20%{transform:translate(36px,16px) rotate(20deg);z-index:4}27%{transform:translate(110px,-10px) rotate(40deg);z-index:4}28%{z-index:0}36%,45%{transform:translate(-38px,16px) rotate(-20deg);z-index:0}52%,70%{transform:translate(-15px,-2px) rotate(-7deg);z-index:1}77%,95%{transform:translate(13px,-2px) rotate(7deg);z-index:2}100%{transform:translate(36px,16px) rotate(20deg);z-index:4}}
@keyframes bj2{0%,20%{transform:translate(13px,-2px) rotate(7deg)}27%,45%{transform:translate(36px,16px) rotate(20deg)}52%{transform:translate(110px,-10px) rotate(40deg)}53%{z-index:0}61%,70%{transform:translate(-38px,16px) rotate(-20deg);z-index:0}77%,95%{transform:translate(-15px,-2px) rotate(-7deg);z-index:1}100%{transform:translate(13px,-2px) rotate(7deg);z-index:2}}
@keyframes bj1{0%,20%{transform:translate(-15px,-2px) rotate(-7deg)}27%,45%{transform:translate(13px,-2px) rotate(7deg)}52%,70%{transform:translate(36px,16px) rotate(20deg);z-index:4}77%{transform:translate(110px,-10px) rotate(40deg);z-index:4}78%{z-index:0}86%,95%{transform:translate(-38px,16px) rotate(-20deg);z-index:0}100%{transform:translate(-15px,-2px) rotate(-7deg)}}
@keyframes bj0{0%,20%{transform:translate(-38px,16px) rotate(-20deg)}27%,45%{transform:translate(-15px,-2px) rotate(-7deg)}52%,70%{transform:translate(13px,-2px) rotate(7deg)}77%,95%{transform:translate(36px,16px) rotate(20deg);z-index:4}100%{transform:translate(36px,16px) rotate(20deg);z-index:4}}

.m-barajar .c0{z-index:1}.m-barajar .c1{z-index:2}.m-barajar .c2{z-index:3}.m-barajar .c3{z-index:4}
</style>
</helmet>
<div class="raiz" style="width: 390px; height: 520px; padding: 20px; background: #fff9ee; display: flex; flex-direction: column; gap: 16px;">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-stretch: 110%; font-size: 24px;">Las cartas se mueven</span>
<div class="selector" role="radiogroup" aria-label="Animación de las cartas"><sc-for list="{{ops}}" as="o" hint-placeholder-count="4"><button type="button" role="radio" class="op" aria-checked="{{o.sel}}" onClick="{{o.elegir}}">{{o.texto}}</button></sc-for></div>
<div class="escena {{modo}}"><div class="baraja " aria-hidden="true"><span class="carta c0"><img src="img/volver-a-saludar.webp" alt=""></span><span class="carta c1"><img src="img/segundo-aaah.webp" alt=""></span><span class="carta c2"><img src="img/gracias-por-volver.webp" alt=""></span><span class="carta c3"><img src="img/primer-hola.webp" alt=""></span></div></div>
<span class="nota">{{explica}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 520}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 'tres' }; }
  renderVals() {
    var self = this, m = this.state.m;
    var t = { tres: 'Las tres', abanico: 'Abanico', asoma: 'Se asoma', barajar: 'Barajar' };
    var ex = { tres: 'Un ciclo de 14 s: la carta destacada se asoma y saluda, después el mazo se recoge, se baraja con dos golpes y se vuelve a abrir con un rebote. Entre un gesto y otro, quieto unos segundos.', abanico: 'El mazo se abre en abanico con un pequeño rebote, se sostiene y se recoge. Cada 7 s.', asoma: 'Quieto en abanico. Cada 5 s, la carta de la jugada destacada se levanta y saluda; las vecinas le abren paso. Recomendada: llama sin cansar.', barajar: 'La carta de delante sale y pasa al fondo, como barajar. Muestra las cuatro jugadas. Es la más movida.' };
    return { modo: 'm-' + m, explica: ex[m], ops: ['tres', 'abanico', 'asoma', 'barajar'].map(function (k) { return { texto: t[k], sel: k === m ? 'true' : 'false', elegir: function () { self.setState({ m: k }); } }; }) };
  }
}
</script>
</body>
</html>
