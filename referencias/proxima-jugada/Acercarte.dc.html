<style>
body{margin:0}

.hoja{position:relative;width:390px;background:#93a89c;overflow:hidden}

.c0{background:#e3eee6;transform:translate(-38px,16px) rotate(-20deg)}
.c1{background:#f9e1e9;transform:translate(-15px,-2px) rotate(-7deg)}
.c2{background:#f2e5d3;transform:translate(13px,-2px) rotate(7deg)}

/* Las tres: un ciclo de 14 s — se asoma, se recoge, baraja y se vuelve a abrir */
.m-tres .carta{animation:14s ease-in-out infinite}
.m-tres .c0{animation-name:tres0}
@keyframes tres0{0%,20%{transform:translate(-38px,16px) rotate(-20deg)}24%,27.5%{transform:translate(-46px,19px) rotate(-24deg)}31%,55%{transform:translate(-38px,16px) rotate(-20deg)}61%{transform:translate(-3px,4px) rotate(-3deg)}64%{transform:translate(-24px,2px) rotate(-8deg)}66.5%{transform:translate(-3px,4px) rotate(-3deg)}69%{transform:translate(24px,2px) rotate(8deg)}71.5%{transform:translate(-3px,4px) rotate(-3deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(-38px,16px) rotate(-20deg)}}
.m-tres .c1{animation-name:tres1}
@keyframes tres1{0%,20%{transform:translate(-15px,-2px) rotate(-7deg);z-index:0}21%{z-index:5}24%,27.5%{transform:translate(-11px,-24px) rotate(-2deg) scale(1.14);z-index:5}25.2%{transform:translate(-11px,-24px) rotate(-6deg) scale(1.14);z-index:5}26.4%{transform:translate(-11px,-24px) rotate(2deg) scale(1.14);z-index:5}30.5%{z-index:5}31%{z-index:0}31%,55%{transform:translate(-15px,-2px) rotate(-7deg)}61%{transform:translate(-1px,2px) rotate(-1deg)}64%{transform:translate(20px,-2px) rotate(6deg)}66.5%{transform:translate(-1px,2px) rotate(-1deg)}69%{transform:translate(-20px,-2px) rotate(-6deg)}71.5%{transform:translate(-1px,2px) rotate(-1deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(-15px,-2px) rotate(-7deg)}}
.m-tres .c2{animation-name:tres2}
@keyframes tres2{0%,20%{transform:translate(13px,-2px) rotate(7deg)}24%,27.5%{transform:translate(20px,1px) rotate(10deg)}31%,55%{transform:translate(13px,-2px) rotate(7deg)}61%{transform:translate(1px,0px) rotate(1deg)}64%{transform:translate(-20px,0px) rotate(-5deg)}66.5%{transform:translate(1px,0px) rotate(1deg)}69%{transform:translate(20px,0px) rotate(5deg)}71.5%{transform:translate(1px,0px) rotate(1deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(13px,-2px) rotate(7deg)}}
.m-tres .c3{animation-name:tres3}
@keyframes tres3{0%,20%{transform:translate(36px,16px) rotate(20deg)}31%,55%{transform:translate(36px,16px) rotate(20deg)}61%{transform:translate(3px,-2px) rotate(3deg)}64%{transform:translate(24px,2px) rotate(8deg)}66.5%{transform:translate(3px,-2px) rotate(3deg)}69%{transform:translate(-24px,2px) rotate(-8deg)}71.5%{transform:translate(3px,-2px) rotate(3deg);animation-timing-function:cubic-bezier(.3,1.45,.5,1)}80%,100%{transform:translate(36px,16px) rotate(20deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.ctx{display:flex;flex-direction:column;gap:12px}
.cardV{background:#dcebe2;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lab{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;font-weight:800}
.sel{white-space:nowrap;flex:none;height:40px;padding:0 14px;border-radius:999px;background:#fff;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.btnP{height:52px;border-radius:999px;background:#174b3a;color:#fff9ee;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:800}
.opc{display:flex;gap:8px}.opc>span{height:44px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.burb{position:relative;margin-left:auto;width:fit-content;max-width:84%;border-radius:14px 4px 14px 14px;padding:8px 10px 20px;font-size:15px;line-height:21px;white-space:pre-line}
.burb .hora{position:absolute;right:8px;bottom:4px;font-size:11px;opacity:.7}
.burb:after{content:'';position:absolute;right:-7px;top:0;border-left:8px solid var(--b);border-bottom:10px solid transparent}
.etq{font-size:13px;font-weight:700;color:#4f6a5e;display:flex;align-items:center;gap:6px}

.esc{position:relative;width:390px;height:1000px;background:#93a89c;overflow:hidden}
.hojaH{position:absolute;inset:40px 0 0;border-radius:28px 28px 0 0;background:#fff9ee;padding:10px 20px 30px;display:flex;flex-direction:column;gap:14px}
.opP{height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #e7dcc8;background:#fff;color:#174b3a;font-family:'Figtree',sans-serif;font-size:15px;font-weight:800;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.opP[aria-checked="true"]{background:#dcebe2;border-color:#dcebe2;padding-left:10px}
.chk{width:20px;height:20px;border-radius:999px;background:#174b3a;color:#fff9ee;display:inline-flex;align-items:center;justify-content:center}
.lista{background:#fff;border:1px solid #efe4d2;border-radius:22px;overflow:hidden}
.filaR{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:0 14px;border:none;border-top:1px solid #efe4d2;background:#fff;color:#174b3a;font-family:'Figtree',sans-serif;text-align:left;cursor:pointer}
.filaR:first-child{border-top:none}
.radio{width:22px;height:22px;border-radius:999px;border:2px solid #b9c7bf;flex:none;display:flex;align-items:center;justify-content:center}
.radio[data-on="true"]{border-color:#174b3a}.radio[data-on="true"]:after{content:'';width:12px;height:12px;border-radius:999px;background:#174b3a}
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prod{position:relative;border:none;padding:0;background:transparent;color:#174b3a;font-family:'Figtree',sans-serif;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}

.prod[aria-pressed="true"] .ft{border-color:#174b3a}
.prod .mk{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:999px;background:rgba(255,249,238,.9);border:2px solid #b9c7bf;display:flex;align-items:center;justify-content:center}
.prod .mk svg{opacity:0}.prod[aria-pressed="true"] .mk svg{opacity:1}
.prod[aria-pressed="true"] .mk{background:#174b3a;border-color:#174b3a;color:#fff9ee}
.prod small{font-size:12px;color:#4f6a5e}

<div style="display: flex; align-items: center; justify-content: space-between;"><h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-stretch: 115%; font-size: 26px;">Escribirle a Luisanna</h2><span style="width: 44px; height: 44px; border-radius: 999px; background: #f3ead9; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span></div>

</div></div>
