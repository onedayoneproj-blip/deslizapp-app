<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escribiendo la nota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#174B3A}a:hover{color:#0F3326}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{display:inline-block;width:2px;height:20px;background:#F26B3A;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #87958B; font-family: Figtree, sans-serif; color: #174B3A">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 790px; background: #FFF9EE; border-radius: 32px 32px 0 0; display: flex; flex-direction: column">
    <div style="width: 52px; height: 5px; border-radius: 3px; background: #E8DCC8; align-self: center; margin-top: 10px"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0">
      <button aria-label="Volver" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: #F2E9DA; display: grid; place-items: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#174B3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 22px">Nota</h1>
      <button style="height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #174B3A; color: #FFF9EE; font-family: Figtree, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">Listo</button>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 8px">
      <div style="position: relative; width: 300px; height: 250px">
        <div style="position: absolute; left: 50%; transform: translateX(-50%); top: -10px; z-index: 2; filter: drop-shadow(0 8px 18px rgba(23,75,58,0.16))">
          <div style="width: 210px; box-sizing: border-box; background: #FFFFFF; border-radius: 34px; padding: 18px 24px; text-align: center; font-size: 19px; font-weight: 600; line-height: 1.3; color: #174B3A">Talla M, le encanta el rosa<span class="caret"></span></div>
          <svg aria-hidden="true" width="54" height="51" viewBox="0 0 36 34" style="position: absolute; left: 34px; top: calc(100% - 15px)"><path d="M0 0H36V10Q27 10 24 16.5A8 8 0 0 1 8.5 15.5Q6 10 0 10Z" fill="#FFFFFF"/><circle cx="23" cy="28.5" r="4.8" fill="#FFFFFF"/></svg>
        </div>
        <div style="position: absolute; left: 80px; top: 92px; width: 140px; height: 140px; border-radius: 50%; background: #F2E9DA; display: grid; place-items: center">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#174B3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c.9 1.3 2.1 2 3.5 2s2.6-.7 3.5-2"/><circle cx="9" cy="10" r=".6" fill="#174B3A"/><circle cx="15" cy="10" r=".6" fill="#174B3A"/></svg>
        </div>
      </div>
      <p style="margin: 6px 0 0; font-size: 14px; color: #5E7268">Solo tú la ves · 26/60</p>
    </div>

    <div aria-hidden="true" style="height: 292px; background: #D3D6DB; padding: 10px 4px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
        <div style="display: flex; gap: 6px; justify-content: center">
          <sc-for list="{{row.keys}}" as="k" hint-placeholder-count="10">
            <span style="width: {{k.w}}px; height: 44px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(0,0,0,0.25); display: grid; place-items: center; font-family: -apple-system, sans-serif; font-size: 20px; color: #111">{{k.t}}</span>
          </sc-for>
        </div>
      </sc-for>
      <div style="display: flex; gap: 6px; justify-content: center">
        <span style="width: 88px; height: 44px; border-radius: 6px; background: #ABB0BA; display: grid; place-items: center; font-family: -apple-system, sans-serif; font-size: 16px; color: #111">123</span>
        <span style="width: 186px; height: 44px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(0,0,0,0.25); display: grid; place-items: center; font-family: -apple-system, sans-serif; font-size: 16px; color: #111">espacio</span>
        <span style="width: 88px; height: 44px; border-radius: 6px; background: #ABB0BA; display: grid; place-items: center; font-family: -apple-system, sans-serif; font-size: 16px; color: #111">listo</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const fila = (s, w) => ({ keys: s.split('').map((t) => ({ t, w })) });
    return { rows: [fila('qwertyuiop', 32), fila('asdfghjklñ', 32), fila('zxcvbnm', 38)] };
  }
}
</script>
</body>
</html>
