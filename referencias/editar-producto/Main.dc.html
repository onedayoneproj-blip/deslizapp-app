<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar producto · resumen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Figtree:wght@400;600;800&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:#174b3a}
a{color:#174b3a}a:hover{color:#0f3428}
button{font:inherit;color:inherit}
.grupo{background:#ffffff;border:1px solid #efe4d2;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.fila{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:0;background:transparent;text-align:left;width:100%;cursor:pointer}
.fila + .fila{border-top:1px solid #efe4d2}
.rot{font-size:12px;line-height:16px;font-weight:800;color:#4f6a5e;margin:0 0 8px 4px;text-transform:none}
.t{font-size:17px;font-weight:800;flex:1}
.v{font-size:14px;color:#4f6a5e;text-align:right}
</style>
</helmet>
<div style="width:390px;height:1320px;position:relative;background:#7f948a;overflow:hidden">
  <div style="position:absolute;left:20px;top:22px;display:flex;align-items:center;gap:10px;opacity:.55">
    <div style="width:40px;height:40px;border-radius:999px;background:#c9c1b1"></div>
    <div style="width:150px;height:14px;border-radius:999px;background:#c9c1b1"></div>
  </div>
  <div style="position:absolute;left:0;right:0;top:69px;bottom:0;background:#fff9ee;border-radius:28px 28px 0 0;display:flex;flex-direction:column">
    <div style="width:40px;height:5px;border-radius:999px;background:#e7dcc8;margin:8px auto 0"></div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 20px 12px">
      <button aria-label="Cerrar" style="width:44px;height:44px;border-radius:999px;border:0;background:#f3ead9;display:grid;place-items:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h1 style="margin:0;font-family:Fredoka,sans-serif;font-size:20px;font-weight:700;flex:1">Editar producto</h1>
      <button style="border:0;background:transparent;font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;display:flex;align-items:center;gap:4px;min-height:44px;cursor:pointer">Ropa
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div style="padding:0 20px;display:flex;flex-direction:column;gap:20px">
      <div>
        <p style="margin:0 0 4px 2px;font-family:Caveat,cursive;font-size:24px;font-weight:600;color:#a8410f">así se ve en tu catálogo</p>
        <div style="height:330px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(180deg,#d9c6a8 0%,#e8dcc5 45%,#7c6a52 100%)">
          <div style="position:absolute;top:12px;left:12px;background:#dcebe2;color:#1f6b47;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px">Visible</div>
          <div style="position:absolute;top:12px;right:12px;background:rgba(16,54,42,.55);color:#fff9ee;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px">1 / 3</div>
          <div style="position:absolute;left:16px;right:16px;bottom:16px;color:#ffffff">
            <p style="margin:0;font-size:28px;font-weight:600;line-height:32px">Camisa de lino</p>
            <p style="margin:4px 0 0;font-size:15px;font-weight:800">Desde RD$1,450 <span style="font-weight:400">· 6 presentaciones</span></p>
          </div>
        </div>
      </div>

      <div>
        <p class="rot">Lo básico</p>
        <div class="grupo">
          <button class="fila"><span class="t">Fotos</span>
            <span style="display:flex;gap:4px"><span style="width:28px;height:28px;border-radius:8px;background:#d9c6a8"></span><span style="width:28px;height:28px;border-radius:8px;background:#c9b48f"></span><span style="width:28px;height:28px;border-radius:8px;background:#a89274"></span></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="fila"><span class="t">Nombre</span><span class="v">Camisa de lino</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="fila"><span class="t">Precio</span><span class="v">RD$1,450</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>

      <div>
        <p class="rot">Presentaciones y stock</p>
        <div class="grupo">
          <button class="fila"><span class="t">Presentaciones</span><span class="v">Talla y color · 6</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="fila"><span class="t">Stock</span><span class="v">14 en total</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="fila" aria-pressed="false"><span class="t">Es por encargo</span>
            <span style="width:51px;height:31px;border-radius:999px;background:#e7dcc8;position:relative"><span style="position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#ffffff"></span></span></button>
        </div>
      </div>

      <div>
        <p class="rot">Hazlo brillar · opcional</p>
        <div class="grupo">
          <button class="fila"><span class="t">Descripción</span><span class="v">Fresca para el calor…</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="fila"><span class="t">Colección</span><span class="v">Verano</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="fila"><span class="t">Ficha técnica</span><span class="v">Agregar</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>

      <div>
        <p class="rot">En tu catálogo</p>
        <div class="grupo">
          <button class="fila" aria-pressed="true"><span class="t">Visible en el catálogo</span>
            <span style="width:51px;height:31px;border-radius:999px;background:#174b3a;position:relative"><span style="position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:999px;background:#fff9ee"></span></span></button>
          <button class="fila"><span class="t">Lista de espera</span><span class="v">2 personas</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="fila"><span class="t">Historial de ajustes</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>

      <button style="border:0;background:transparent;color:#b4432a;font-size:16px;font-weight:800;min-height:44px;cursor:pointer">Eliminar producto</button>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;padding:28px 20px 34px;background:linear-gradient(180deg,rgba(255,249,238,0) 0%,rgba(255,249,238,.92) 40%,#fff9ee 100%)">
      <button style="width:100%;height:52px;border-radius:999px;border:0;background:#174b3a;color:#fff9ee;font-size:17px;font-weight:800;cursor:pointer">Guardar cambios</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
