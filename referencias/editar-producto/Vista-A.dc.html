<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ver producto · foto grande</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Figtree:wght@400;600;800&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:#174b3a}
a{color:#174b3a}a:hover{color:#0f3428}
button{font:inherit;color:inherit}
.grupo{background:#ffffff;border:1px solid #efe4d2;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.fila{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:0;background:transparent;text-align:left;width:100%;cursor:pointer}
.fila + .fila{border-top:1px solid #efe4d2}
.t{font-size:17px;font-weight:800;flex:1;display:flex;flex-direction:column}
.t small{font-size:14px;font-weight:400;color:#4f6a5e}
.paso{width:40px;height:40px;border-radius:999px;border:1px solid #e7dcc8;background:#fff9ee;font-size:20px;font-weight:800;cursor:pointer;flex-shrink:0}
.cant{width:30px;text-align:center;font-family:Fredoka,sans-serif;font-size:20px;font-weight:600}
.pres{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 10px 0 16px}
.pres + .pres{border-top:1px solid #efe4d2}
</style>
</helmet>
<div style="width:390px;height:1000px;position:relative;background:#7f948a;overflow:hidden">
  <div style="position:absolute;left:0;right:0;top:69px;bottom:0;background:#fff9ee;border-radius:28px 28px 0 0;display:flex;flex-direction:column">
    <div style="width:40px;height:5px;border-radius:999px;background:#e7dcc8;margin:8px auto 0"></div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 20px 10px">
      <button aria-label="Cerrar" style="width:44px;height:44px;border-radius:999px;border:0;background:#f3ead9;display:grid;place-items:center;cursor:pointer;flex-shrink:0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h1 style="margin:0;font-family:Fredoka,sans-serif;font-size:20px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Lo Covel</h1>
      <button style="height:44px;padding:0 18px;border-radius:999px;border:0;background:#f3ead9;font-size:16px;font-weight:800;cursor:pointer;flex-shrink:0">Editar</button>
    </div>

    <div style="padding:0 20px;display:flex;flex-direction:column;gap:14px">
      <div style="height:300px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(160deg,#e9a9b8 0%,#e8c3b0 45%,#cdb79a 100%)">
        <div style="position:absolute;left:46px;top:50px;width:90px;height:170px;border-radius:18px;background:#1f4d3c;transform:rotate(-8deg)"></div>
        <div style="position:absolute;left:140px;top:30px;width:90px;height:170px;border-radius:18px;background:#f2c6d2;transform:rotate(6deg)"></div>
        <div style="position:absolute;left:220px;top:90px;width:90px;height:170px;border-radius:18px;background:#f6ecdc;transform:rotate(-4deg)"></div>
        <div style="position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px" role="img" aria-label="Foto 1 de 4">
          <span style="flex:1;height:3px;border-radius:999px;background:#ffffff"></span>
          <span style="flex:1;height:3px;border-radius:999px;background:rgba(255,255,255,.45)"></span>
          <span style="flex:1;height:3px;border-radius:999px;background:rgba(255,255,255,.45)"></span>
          <span style="flex:1;height:3px;border-radius:999px;background:rgba(255,255,255,.45)"></span>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(180deg,rgba(16,54,42,0) 0%,rgba(16,54,42,.78) 100%);color:#ffffff;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center;gap:10px">
            <p style="margin:0;font-family:Fredoka,sans-serif;font-size:26px;font-weight:600;flex:1">RD$650</p>
            <span style="background:#ffe3d6;color:#a8410f;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px">Agotado</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px" aria-label="Presentaciones: Verde, Rosa, Crema">
            <span style="width:16px;height:16px;border-radius:999px;background:#1f4d3c;border:2px solid #ffffff"></span>
            <span style="width:16px;height:16px;border-radius:999px;background:#f2c6d2;border:2px solid #ffffff"></span>
            <span style="width:16px;height:16px;border-radius:999px;background:#f6ecdc;border:2px solid #ffffff"></span>
            <span style="font-size:13px;font-weight:800;margin-left:4px">3 colores</span>
          </div>
        </div>
      </div>

      <button style="display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:22px;border:0;background:#ffe3d6;text-align:left;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a8410f" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="flex:1;font-size:17px;font-weight:800;color:#a8410f">3 personas lo esperan</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8410f" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="grupo">
        <button class="fila" aria-pressed="true"><span class="t">Visible en el catálogo<small>Se ve como «Agotado»</small></span>
          <span style="width:51px;height:31px;border-radius:999px;background:#174b3a;position:relative;flex-shrink:0"><span style="position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:999px;background:#fff9ee"></span></span></button>
      </div>

      <div class="grupo">
        <button class="fila" aria-expanded="true"><span class="t">Stock<small>3 presentaciones · 0 en total</small></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        <div class="pres"><span style="width:12px;height:12px;border-radius:999px;background:#1f4d3c"></span><span style="flex:1;font-size:16px;font-weight:800">Verde</span><button class="paso" aria-label="Uno menos en Verde">−</button><span class="cant">0</span><button class="paso" aria-label="Uno más en Verde">+</button></div>
        <div class="pres"><span style="width:12px;height:12px;border-radius:999px;background:#f2c6d2;border:1px solid #c9bfae"></span><span style="flex:1;font-size:16px;font-weight:800">Rosa</span><button class="paso" aria-label="Uno menos en Rosa">−</button><span class="cant">0</span><button class="paso" aria-label="Uno más en Rosa">+</button></div>
        <div class="pres"><span style="width:12px;height:12px;border-radius:999px;background:#f6ecdc;border:1px solid #c9bfae"></span><span style="flex:1;font-size:16px;font-weight:800">Crema</span><button class="paso" aria-label="Uno menos en Crema">−</button><span class="cant">0</span><button class="paso" aria-label="Uno más en Crema">+</button></div>
      </div>

      <div class="grupo">
        <button class="fila"><span class="t">Historial de ajustes</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;padding:24px 20px 34px;background:linear-gradient(180deg,rgba(255,249,238,0) 0%,#fff9ee 45%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <button style="height:52px;border-radius:999px;border:1.5px solid #174b3a;background:#fff9ee;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3 2.2"/><path d="M12 8.5v7M8.5 12h7"/></svg>
        A tu historia
      </button>
      <button style="height:52px;border-radius:999px;border:0;background:#174b3a;color:#fff9ee;font-size:16px;font-weight:800;cursor:pointer">Crear pedido</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
