<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Figtree:wght@400;600;800&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:#174b3a}
a{color:#174b3a}a:hover{color:#0f3428}
button{font:inherit;color:inherit}
.grupo{background:#ffffff;border:1px solid #efe4d2;border-radius:22px;overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 12px 0 16px}
.fila + .fila{border-top:1px solid #efe4d2}
.n{flex:1;font-size:17px;font-weight:800}
.paso{width:44px;height:44px;border-radius:999px;border:1px solid #e7dcc8;background:#fff9ee;font-size:22px;font-weight:800;cursor:pointer}
.cant{width:36px;text-align:center;font-family:Fredoka,sans-serif;font-size:22px;font-weight:600}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid #e7dcc8;background:#ffffff;font-size:14px;font-weight:800;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;background:#7f948a;overflow:hidden">
  <div style="position:absolute;left:0;right:0;top:69px;height:120px;background:#e6ddcc;border-radius:28px 28px 0 0;opacity:.9">
    <p style="margin:18px 0 0 76px;font-family:Fredoka,sans-serif;font-size:20px;font-weight:700;color:#4f6a5e">Editar producto</p>
  </div>
  <div style="position:absolute;left:0;right:0;top:95px;bottom:0;background:#fff9ee;border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(16,54,42,.16)">
    <div style="width:40px;height:5px;border-radius:999px;background:#e7dcc8;margin:8px auto 0"></div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 20px 8px">
      <button aria-label="Cerrar sin cambiar" style="width:44px;height:44px;border-radius:999px;border:0;background:#f3ead9;display:grid;place-items:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h1 style="margin:0;font-family:Fredoka,sans-serif;font-size:20px;font-weight:700;flex:1">Inventario</h1>
      <span style="font-size:14px;color:#4f6a5e">12 en total</span>
    </div>
    <div style="padding:0 20px;display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:4px 0 0;font-family:Fredoka,sans-serif;font-size:26px;font-weight:700">¿Cuántos tienes ahora?</h2>
      <p style="margin:-6px 0 0;font-size:15px;color:#4f6a5e">Cuéntalos como están hoy en tu casa o tu tienda.</p>
      <div>
        <p style="margin:0 0 6px 4px;font-size:12px;font-weight:800;color:#4f6a5e;display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:999px;background:#f1ece2;border:1px solid #c9bfae"></span>Blanco · 5</p>
        <div class="grupo">
          <div class="fila"><span class="n">S</span><button class="paso" aria-label="Uno menos">−</button><span class="cant">2</span><button class="paso" aria-label="Uno más">+</button></div>
          <div class="fila" style="background:#ffe3d6"><span class="n">M <span style="font-size:13px;font-weight:800;color:#a8410f">antes 3</span></span><button class="paso" aria-label="Uno menos">−</button><span class="cant">1</span><button class="paso" aria-label="Uno más">+</button></div>
          <div class="fila"><span class="n">L</span><button class="paso" aria-label="Uno menos">−</button><span class="cant">2</span><button class="paso" aria-label="Uno más">+</button></div>
        </div>
      </div>
      <div style="background:#ffffff;border:1px solid #efe4d2;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px">
        <p style="margin:0;font-size:17px;font-weight:800">Bajaste 2 en Blanco · M. ¿Qué pasó?</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="chip">Daño</button>
          <button class="chip">Pérdida</button>
          <button class="chip" aria-pressed="true" style="background:#dcebe2;border-color:#174b3a;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Corrección de inventario</button>
          <button class="chip">Otro</button>
        </div>
        <p style="margin:0;font-size:14px;color:#4f6a5e">No cuenta como venta. Queda en el historial.</p>
      </div>
      <p style="margin:0 0 0 4px;font-size:12px;font-weight:800;color:#4f6a5e;display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:999px;background:#c9b48f"></span>Arena · 7</p>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:28px 20px 34px;background:linear-gradient(180deg,rgba(255,249,238,0) 0%,#fff9ee 45%)">
      <button style="width:100%;height:52px;border-radius:999px;border:0;background:#174b3a;color:#fff9ee;font-size:17px;font-weight:800;cursor:pointer">Listo</button>
    </div>
  </div>
</div>
</x-dc>
