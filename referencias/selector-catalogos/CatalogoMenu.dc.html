<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catálogo, nombre con menú</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,500..700&amp;family=Figtree:wght@400;600;800&amp;family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0}
.pant{width:390px;height:844px;background:#fff9ee;position:relative;overflow:hidden;box-sizing:border-box;font-family:'Figtree',sans-serif;color:#174b3a}
.disp{font-family:'Fredoka',sans-serif;font-weight:600;font-stretch:115%}
.titulo-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;margin:0;color:#174b3a;cursor:pointer;font-size:32px;line-height:1.1}
.sub{margin:4px 0 0;font-size:14px;color:#4f6a5e}
.tarjeta{border-radius:22px;background:#fff;border:1px solid #efe4d2;padding:14px 16px;display:flex;align-items:center;gap:12px}
.buscar{height:48px;border-radius:999px;border:1.5px solid #e7dcc8;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;box-sizing:border-box;font-size:16px;color:#4f6a5ecc}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.foto{height:176px;border-radius:20px}
.velo{position:absolute;inset:0;background:#10362a1f}
.menu{position:absolute;left:16px;top:104px;width:260px;border-radius:16px;background:#fffdf8f2;box-shadow:0 18px 50px -12px #10362a55,0 0 0 1px #10362a14;overflow:hidden}
.op{width:100%;min-height:48px;border:0;background:none;display:flex;align-items:center;gap:10px;padding:0 16px;box-sizing:border-box;font:600 16px 'Figtree',sans-serif;color:#174b3a;text-align:left;border-bottom:1px solid #10362a14}
.op .n{margin-left:auto;font-size:14px;font-weight:600;color:#4f6a5e}
.check{width:18px;flex:none}
.sep{height:8px;background:#10362a0d}
.barra{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fffdf8;border-top:1px solid #efe4d2}
.fab{position:absolute;right:18px;bottom:98px;height:54px;border:0;border-radius:999px;background:#ff834f;color:#10362a;padding:0 20px 0 16px;display:inline-flex;align-items:center;gap:8px;font:800 16px 'Figtree',sans-serif;box-shadow:0 10px 26px -8px #10362a66}
</style>
</helmet>
<div class="pant">
  <div style="padding: 58px 20px 0">
    <button class="titulo-btn disp" type="button" aria-expanded="true">Accesorios<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
    <p class="sub">Tus catálogos viven aquí. Toca el nombre y cambia.</p>
  </div>
  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div class="tarjeta"><div style="width: 40px; height: 40px; border-radius: 12px; background: #dcebe2"></div><div style="font-weight: 800; font-size: 15px">Tu catálogo está en línea</div></div>
    <div class="buscar">Busca un producto</div>
    <div class="grid"><div class="foto" style="background: #f5c9d6"></div><div class="foto" style="background: #dcebe2"></div></div>
  </div>
  <button class="fab" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10362a" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Producto</button>
  <div class="barra"></div>
  <div class="velo"></div>
  <div class="menu" role="menu" aria-label="Elegir catálogo">
    <button class="op" type="button" role="menuitemradio" aria-checked="false"><span class="check"></span>Perfumes<span class="n">8</span></button>
    <button class="op" type="button" role="menuitemradio" aria-checked="true" style="border-bottom: 0"><svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Accesorios<span class="n">7</span></button>
    <div class="sep"></div>
    <button class="op" type="button" role="menuitem" style="border-bottom: 0"><svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Lo que vendes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
