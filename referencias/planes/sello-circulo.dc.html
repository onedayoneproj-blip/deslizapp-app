<script type="text/x-dc" data-dc-script data-props='{"lugar":{"editor":"enum","default":"Junto al selector (uno solo)","options":["Junto al selector (uno solo)","En la esquina de cada plan"],"section":"Sello"},"$preview":{"width":390,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { anual: true }; }
  renderVals() {
    const cada = (this.props.lugar ?? '').startsWith('En la esquina');
    const anual = this.state.anual;
    const f = n => 'RD$' + n.toLocaleString('en-US');
    const P = [['Inicial', 499, false], ['Negocio', 999, true], ['Pro', 1499, false]];
    return {
      anual,
      enSwitch: anual && !cada,
      enTarjeta: anual && cada,
      swM: anual ? 'transparent' : '#FFF9EE', swMt: anual ? '#FFF9EE' : '#174B3A',
      swA: anual ? '#FFF9EE' : 'transparent', swAt: anual ? '#174B3A' : '#FFF9EE',
      planes: P.map(([nombre, m, dest]) => ({
        nombre, fondo: dest ? '#FFF9EE' : '#E7F2EA', borde: dest ? '3px solid #FF834F' : 'none',
        precio: f(anual ? m * 10 : m), periodo: anual ? '/año' : '/mes', circulo: f(Math.round(12 * m * 0.7))
      })),
      mensual: () => this.setState({ anual: false }),
      ponAnual: () => this.setState({ anual: true })
    };
  }
}
</script>
