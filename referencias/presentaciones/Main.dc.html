<!doctype html>

<head>
<meta charset="utf-8">

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&family=Fredoka:wght@600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">

<div style="width:390px;height:844px;box-sizing:border-box;background:#fff9ee;color:#174b3a;font-family:Figtree,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px">
    <h1 style="margin:0;font-family:Fredoka,system-ui,sans-serif;font-size:24px;line-height:28px;font-weight:700">Producto nuevo</h1>
    <button type="button" aria-label="Cerrar" style="width:44px;height:44px;border-radius:999px;border:0;background:#f3ead9;color:#174b3a;font-size:20px">✕</button>
  </div>
  <div style="flex:1;overflow:hidden;padding:8px 20px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;gap:10px">
      <div style="width:96px;height:120px;border-radius:16px;background:#c9d6c9;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:12px;font-weight:800;color:#174b3a">Foto 1</div>
      <div style="width:96px;height:120px;border-radius:16px;background:#e3d2c0;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:12px;font-weight:800;color:#174b3a">Foto 2</div>
      <button type="button" style="width:96px;height:120px;border-radius:16px;border:2px dashed #9c8b6e;background:#fff;color:#174b3a;font-size:14px;font-weight:800">+ Foto</button>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800">Nombre
      <span style="height:50px;border:2px solid #9c8b6e;border-radius:16px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:16px;font-weight:400">Camisa de lino</span>
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800">Precio (RD$)
      <span style="height:50px;border:2px solid #9c8b6e;border-radius:16px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:16px;font-weight:800">1,850</span>
    </label>
    <section aria-labelledby="t1" style="display:flex;flex-direction:column;gap:8px">
      <h3 id="t1" style="margin:0;font-family:Fredoka,system-ui,sans-serif;font-size:20px;line-height:24px;font-weight:700">Presentaciones</h3>
      <div style="background:#fff;border:1px solid #efe4d2;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px">
        <p style="margin:0;font-size:16px;line-height:24px">¿Viene en varias tallas, colores o tamaños?</p>
        <p style="margin:0;font-size:14px;line-height:20px;color:#4f6a5e">Cada una lleva su propio stock, y su precio si cambia. Tu cliente elige la suya.</p>
        <button type="button" style="height:44px;border-radius:999px;border:0;background:#174b3a;color:#fff9ee;font-size:16px;font-weight:800">Agregar presentaciones</button>
        <button type="button" style="min-height:44px;border:0;background:transparent;color:#4f6a5e;font-size:14px;font-weight:800">No, solo viene de una forma</button>
      </div>
    </section>
    <div style="background:#fff;border:1px solid #efe4d2;border-radius:22px;padding:16px;display:flex;align-items:center;justify-content:space-between;opacity:.55">
      <div><div style="font-size:17px;font-weight:800">Stock</div><div style="font-size:14px;color:#4f6a5e">Se llena cuando agregues presentaciones</div></div>
    </div>
  </div>
  <div style="padding:12px 20px 20px"><button type="button" style="width:100%;height:52px;border-radius:999px;border:0;background:#174b3a;color:#fff9ee;font-size:17px;font-weight:800">Guardar</button></div>
</div>
</x-dc>

</html>
