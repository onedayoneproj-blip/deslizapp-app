<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Opción B: todas las presentaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rl{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:#2a1a22;background:#2a1a22}
.ph{position:absolute;inset:0;background:linear-gradient(180deg,#2b2b2b 0%,#454545 60%,#2a1a22 100%)}
.vl{position:absolute;inset:0;background:rgba(42,26,34,.55)}
.sh{position:absolute;left:0;right:0;bottom:0;background:#f7ede9;border-radius:22px 22px 0 0;padding:14px 20px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.gr{align-self:center;width:44px;height:5px;border-radius:99px;background:#e6d5cf}
.tt{display:flex;gap:12px;align-items:center}
.th{width:48px;height:60px;border-radius:10px;background:#2b2b2b;flex:none}
h3{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:26px;line-height:1.05}
.sub{font-size:13px;color:#7c6770;font-weight:700}
.gd{display:grid;grid-template-columns:96px repeat(4,1fr);gap:8px;align-items:center}
.hh{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7c6770;text-align:center}
.cn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.ph2{width:30px;height:38px;border-radius:8px;flex:none}
.c{height:46px;border-radius:14px;border:1.5px solid #2a1a22;display:grid;place-items:center;font:800 13px Manrope,sans-serif;position:relative;background:#fff}
.c.on{background:#2a1a22;color:#fff}
.c.ag{border:1.5px dashed #c9b8b0;color:#c9b8b0;background:transparent}
.c.ag::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:1.5px solid #c9b8b0}
.c small{position:absolute;top:-7px;right:-4px;background:#ffe3d6;color:#a8410f;border-radius:99px;font-size:10px;font-weight:800;padding:1px 6px}
.lg{display:flex;gap:14px;font-size:12px;color:#7c6770;font-weight:700}
.sel{background:#fff;border:1px solid #e6d5cf;border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}
.sel span{color:#a3325c;font-size:12px}
.btn{height:52px;border-radius:999px;background:#e0457b;color:#fff;font:800 16px Manrope,sans-serif;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="rl">
  <div class="ph"></div>
  <div class="vl"></div>
  <div class="sh">
    <div class="gr"></div>
    <div class="tt"><i class="th"></i><div><h3>Camisa de lino</h3><div class="sub">RD$ 1,850 · elige la tuya</div></div></div>
    <div class="gd">
      <span></span><span class="hh">S</span><span class="hh">M</span><span class="hh">L</span><span class="hh">XL</span>
      <div class="cn"><i class="ph2" style="background:#2b2b2b"></i>Negro</div>
      <div class="c">S</div><div class="c on">M<small>2</small></div><div class="c ag">L</div><div class="c">XL</div>
      <div class="cn"><i class="ph2" style="background:#d9c9a8"></i>Arena</div>
      <div class="c">S</div><div class="c">M</div><div class="c">L</div><div class="c">XL<small style="background:#f6e1e8;color:#8a2a4e">2.100</small></div>
      <div class="cn"><i class="ph2" style="background:#4a5d4f"></i>Verde</div>
      <div class="c ag">S</div><div class="c">M</div><div class="c">L</div><div class="c ag">XL</div>
    </div>
    <div class="lg"><span>Tachado = agotado</span><span>Número = quedan pocas</span></div>
    <div class="sel"><span style="color:#2a1a22;font-size:14px">M · Negro</span><span>Quedan 2</span></div>
    <div class="btn">Agregar a mi pedido</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
