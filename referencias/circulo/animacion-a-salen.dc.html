<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A · Salen desde el centro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,500..700&amp;family=Figtree:wght@400;600;700;800&amp;family=Caveat:wght@700&amp;display=swap">
<style>
body{margin:0}
.esc{width:200px;height:200px;position:relative;display:block}
.aro{position:absolute;border-radius:50%;border:5px solid;box-sizing:border-box;display:block}
.a1{inset:32px;border-color:#FF834F}.a2{inset:27px;border-color:#F5C9D6}.a3{inset:22px;border-color:#174B3A}
.foto{position:absolute;inset:37px;border-radius:50%;border:5px solid var(--hueco);box-sizing:border-box;background:#F5C9D6;color:#174B3A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;font-family:Figtree,sans-serif}
.sello{position:absolute;left:131px;top:131px;width:40px;height:40px;border-radius:50%;background:#174B3A;border:3px solid var(--hueco);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
@keyframes sale{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes popsello{0%{transform:scale(0) rotate(-35deg)}65%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.a1{animation:sale .6s cubic-bezier(.2,.8,.3,1) .1s both}.a2{animation:sale .6s cubic-bezier(.2,.8,.3,1) .35s both}.a3{animation:sale .6s cubic-bezier(.2,.8,.3,1) .6s both}.sello{animation:popsello .5s ease-out 1s both}
@media (prefers-reduced-motion: reduce){.esc *,.esc{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 640px; box-sizing: border-box; background: #FFF9EE; color: #174B3A; font-family: Figtree, system-ui, sans-serif; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 30px; color: #FF834F">A</span>
    <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 24px">Salen desde el centro</span>
  </div>
  <div style="height: 270px; border-radius: 26px; background: {{fondo}}; display: flex; align-items: center; justify-content: center; --hueco: {{fondo}}">
    <sc-if value="{{vivo}}" hint-placeholder-val="{{true}}">
      <span class="esc">
          <span class="aro a3"></span><span class="aro a2"></span><span class="aro a1"></span>
          <span class="foto">TT</span>
          <span class="sello" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="#F5C9D6"><path d="M12 20.3s-7.3-4.4-9.2-8.9C1.3 7.9 3.4 4.6 6.8 4.6c2.1 0 3.5 1.1 5.2 3 1.7-1.9 3.1-3 5.2-3 3.4 0 5.5 3.3 4 6.8-1.9 4.5-9.2 8.9-9.2 8.9z"></path></svg></span>
      </span>
    </sc-if>
  </div>
  <button type="button" onClick="{{repetir}}" style="align-self: center; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1.5px solid #174B3A; background: #FFFFFF; color: #174B3A; font-family: Figtree, sans-serif; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#174B3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4.5h4.5"></path></svg>Repetir</button>
  <p style="margin: 0; font-size: 14.5px; line-height: 1.45">Los aros salen de detrás de la foto uno tras otro, de adentro hacia afuera, con un pequeño rebote. Al final aparece el corazón. Dura 1,4 s y se queda quieto.</p>
  <p style="margin: 0; font-size: 13.5px; line-height: 1.4; color: #4F6A5E"><b style="color: #174B3A">Dónde:</b> Para el momento en que la tienda entra al Círculo, y la primera vez que abre el panel.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fondo":{"editor":"enum","default":"Crema","options":["Crema","Bosque (tarjeta del Círculo)"],"section":"Fondo"},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { vivo: true }; }
  renderVals() {
    const bosque = (this.props.fondo ?? 'Crema').startsWith('Bosque');
    return {
      fondo: bosque ? '#174B3A' : '#F3EAD9',
      vivo: this.state.vivo,
      repetir: () => { this.setState({ vivo: false }); setTimeout(() => this.setState({ vivo: true }), 60); }
    };
  }
}
</script>
</body>
</html>
