<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>3 · Registrar abono (tócalo)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Figtree:wght@400;600;700;800&amp;family=Fredoka:wght@500;600&amp;display=swap">
<style>body{margin:0;background:#f3eadb;font-family:Figtree,sans-serif;color:#174b3a}
button{font-family:Figtree,sans-serif;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:active{opacity:.7}button:focus-visible,input:focus-visible{outline:3px solid #ff834f;outline-offset:2px}
.entrar{animation:entrar .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes entrar{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.barra{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.sello{animation:sello .7s .2s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sello{from{opacity:0;transform:scale(1.8) rotate(-24deg)}to{opacity:1;transform:rotate(-10deg)}}
.confeti{position:absolute;width:8px;height:8px;border-radius:2px;top:-12px;animation:confeti 3s ease-in infinite}
@keyframes confeti{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(300px) rotate(320deg);opacity:0}}
.latido{animation:latido 1.8s ease-out infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(255,131,79,.55)}100%{box-shadow:0 0 0 8px rgba(255,131,79,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff9ee; position: relative; overflow: hidden; display: flex; flex-direction: column; background: rgba(16, 54, 42, 0.45)">
<div style="flex-grow: 1"></div>
<div class="entrar" style="background: #fff9ee; border-radius: 28px 28px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #cdbfa6; align-self: center"></div>
<div><h2 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px">Registrar abono</h2><p style="margin: 4px 0 0; font-size: 14px; color: #4f6a5e">Yahaira debe RD$2,800 del pedido #1006</p></div>
<div style="background: #ffffff; border: 1px solid #efe4d2; border-radius: 22px; padding: 14px 16px"><label for="monto" style="font-size: 13px; color: #4f6a5e">¿Cuánto te pagó?</label><div style="display: flex; align-items: baseline; gap: 6px; margin-top: 2px"><span style="font-family: Fredoka, sans-serif; font-size: 26px; color: #4f6a5e">RD$</span><input id="monto" type="text" inputmode="numeric" value="{{montoTexto}}" style="border: none; outline: none; background: transparent; width: 100%; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 44px; color: #174b3a; padding: 0"></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{rapidos}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.elegir}}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13.5px; font-weight: 800; display: flex; align-items: center; box-sizing: border-box; border: {{r.borde}}; background: {{r.fondo}}; color: {{r.color}}">{{r.texto}}</button>
</sc-for>
</div>
<div><p style="margin: 0 0 8px; font-size: 13px; color: #4f6a5e">¿Cómo te pagó?</p><div style="display: flex; gap: 8px">
<sc-for list="{{metodos}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.elegir}}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13.5px; font-weight: 800; display: flex; align-items: center; box-sizing: border-box; flex-grow: 1; justify-content: center; border: {{m.borde}}; background: {{m.fondo}}; color: {{m.color}}">{{m.texto}}</button>
</sc-for>
</div></div>
<div style="display: flex; gap: 10px"><div style="background: #ffffff; border: 1px solid #efe4d2; border-radius: 22px; flex-grow: 1; padding: 10px 14px"><span style="font-size: 12px; color: #4f6a5e">Fecha</span><p style="margin: 2px 0 0; font-size: 14.5px; font-weight: 700">Hoy, 30 sep</p></div><div style="background: #ffffff; border: 1px solid #efe4d2; border-radius: 22px; flex-grow: 1; padding: 10px 14px"><span style="font-size: 12px; color: #4f6a5e">Nota (opcional)</span><p style="margin: 2px 0 0; font-size: 14.5px; color: #cdbfa6">Ej. le di cambio</p></div></div>
<sc-if value="{{saldado}}" hint-placeholder-val="{{false}}"><div class="entrar" style="border-radius: 16px; background: #dcebe2; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#dcebe2"></circle><path d="M7.4 12.9c1.1.9 2 1.8 2.8 2.9 1.6-2.7 3.6-4.8 6.4-6.5" fill="none" stroke="#174b3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Con este abono queda saldado</div></sc-if>
<sc-if value="{{debeAun}}" hint-placeholder-val="{{true}}"><div class="entrar" style="border-radius: 16px; background: #f3ead9; padding: 12px 14px; font-size: 14px">Después de este abono debe <b>{{restaTexto}}</b></div></sc-if>
<button type="button" style="height: 48px; border-radius: 24px; border: none; background: #174b3a; color: #fff9ee; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">Guardar abono</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { monto: 1000, metodo: 'Efectivo' }; }
renderVals() {
const DEBE = 2800, s = this.state;
const f = n => 'RD$' + n.toLocaleString('en-US');
const sel = on => ({ borde: on ? '1.5px solid #174b3a' : '1.5px solid #e7dcc8', fondo: on ? '#174b3a' : '#ffffff', color: on ? '#fff9ee' : '#174b3a' });
const opciones = [{ t: 'Todo · ' + f(DEBE), v: DEBE }, { t: 'Mitad · ' + f(DEBE / 2), v: DEBE / 2 }, { t: f(500), v: 500 }, { t: f(1000), v: 1000 }];
return {
montoTexto: s.monto.toLocaleString('en-US'),
rapidos: opciones.map(o => ({ texto: o.t, ...sel(o.v === s.monto), elegir: () => this.setState({ monto: o.v }) })),
metodos: ['Efectivo', 'Transferencia', 'Otro'].map(m => ({ texto: m, ...sel(m === s.metodo), elegir: () => this.setState({ metodo: m }) })),
saldado: s.monto >= DEBE, debeAun: s.monto < DEBE, restaTexto: f(DEBE - s.monto),
};
}
}
</script>
</body>
</html>
