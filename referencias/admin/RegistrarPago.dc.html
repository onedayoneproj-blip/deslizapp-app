<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin: registrar pago</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,500..700&amp;family=Figtree:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.f{font-family:'Fredoka',sans-serif;font-weight:700;font-stretch:112%}
.l{font-size:14px;font-weight:800}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #e3d6bf;background:#fff;font-family:'Figtree',sans-serif;font-size:14px;font-weight:800;color:#174b3a;display:inline-flex;align-items:center;cursor:pointer}
.chip.on{background:#174b3a;border-color:#174b3a;color:#fff9ee}
.in{height:52px;border:2px solid #9c8b6e;border-radius:16px;background:#fff;padding:0 14px;display:flex;align-items:center;font-size:16px}
.campo{display:flex;flex-direction:column;gap:6px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; overflow: hidden; background: #93a89c; font-family: 'Figtree', sans-serif; color: #174b3a;">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 110px; background: #fff9ee; border-radius: 30px 30px 0 0; padding: 10px 20px 36px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; justify-content: center;"><span style="width: 40px; height: 5px; border-radius: 999px; background: #e7dcc8;"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="display: flex; flex-direction: column; gap: 2px;"><h2 class="f" style="margin: 0; font-size: 26px;">Registrar pago</h2><span style="font-size: 14px; color: #4f6a5e;">Mora Shoes · Pro</span></span>
      <button type="button" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #f3ead9; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="campo"><span class="l">Qué pagó</span><span style="display: flex; gap: 8px;"><button type="button" class="chip on">Mensualidad</button><button type="button" class="chip">Créditos</button><button type="button" class="chip">Instalación</button></span></div>
    <label class="campo"><span class="l">Monto (RD$)</span><span class="in" style="font-weight: 800; font-size: 20px;">3,200</span><span style="font-size: 13px; color: #4f6a5e;">El precio de su plan. Cámbialo si pagó otra cosa.</span></label>
    <div class="campo"><span class="l">Cómo pagó</span><span style="display: flex; gap: 8px;"><button type="button" class="chip on">Transferencia</button><button type="button" class="chip">Depósito</button><button type="button" class="chip">Efectivo</button></span></div>
    <label class="campo"><span class="l">Referencia</span><span class="in" style="color: #4f6a5e;">Opcional</span></label>
    <div class="campo"><span class="l">Comprobante</span>
      <span style="height: 72px; border: 2px dashed #c9b998; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800; color: #4f6a5e;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f6a5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 9"/></svg>Foto de la captura</span>
    </div>

    <div style="background: #dcebe2; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f6b47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span style="font-size: 14.5px; font-weight: 700; line-height: 20px;">Queda pagada hasta el <b>7 de noviembre</b>. Sale de Atrasadas y su tienda sigue andando.</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 15px;">Mandarle el recibo</b><span style="font-size: 13px; color: #4f6a5e;">Por WhatsApp, con su imagen</span></span>
      <span role="switch" aria-checked="true" aria-label="Mandarle el recibo" style="width: 50px; height: 30px; border-radius: 999px; background: #174b3a; position: relative;"><span style="position: absolute; right: 3px; top: 3px; width: 24px; height: 24px; border-radius: 999px; background: #fff9ee;"></span></span>
    </div>

    <button type="button" style="margin-top: auto; height: 54px; border: none; border-radius: 999px; background: #174b3a; color: #fff9ee; font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer;">Registrar pago</button>
  </div>
</div>
</x-dc>
