<style>
body{margin:0}
.disp{font-family:'Fredoka',sans-serif;font-weight:600;font-stretch:115%}

.hoja{position:absolute;left:0;right:0;top:44px;bottom:0;background:#fff9ee;border-radius:30px 30px 0 0;overflow:hidden}

.asa{width:44px;height:5px;border-radius:999px;background:#e2d5bf;margin:0 auto 8px}

.gh{flex:1;height:56px;border-radius:999px;border:1.5px solid #174b3a;background:#fff;color:#174b3a;font:800 16px 'Figtree',sans-serif;box-shadow:0 8px 24px #10362a2e}
.chip{height:40px;border-radius:999px;border:1.5px solid #e7dcc8;background:#fff;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:#174b3a}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.sw.on{background:#174b3a}.sw.on::after{left:23px}

.sub{font-size:13px;color:#4f6a5e;font-weight:600}

.pres{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pp{height:30px;border-radius:999px;border:1.5px solid #e7dcc8;background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800}
.pt{width:14px;height:14px;border-radius:50%;border:1px solid #0002}
.pie{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed #e2d5bf}
.qr{width:46px;height:46px;border-radius:8px;background:repeating-linear-gradient(90deg,#174b3a 0 4px,#fff 4px 7px),#174b3a;flex:none;border:3px solid #fff;outline:1px solid #e7dcc8}
.stk{position:absolute;font-family:'Fredoka';font-weight:700;font-stretch:115%;color:#fff;border-radius:999px;padding:8px 18px;font-size:22px;border:4px solid #fff;box-shadow:0 8px 18px #0004}
.marca{position:absolute;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px 6px 6px;font-family:'Fredoka';font-weight:600;font-size:15px;color:#174b3a;border:4px solid #fff;outline:1px solid #0000;box-shadow:0 8px 18px #0004}
.pk{position:relative;display:inline-flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;font-stretch:115%;border-radius:999px;padding:6px 14px;font-size:16px;border:3px solid #fff;box-shadow:0 5px 12px #0003;color:#fff}
.ck{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#174b3a;border:2px solid #fff;display:grid;place-items:center}
.marca i{width:28px;height:28px;border-radius:50%;background:#f4c6d4;display:grid;place-items:center;font-style:normal}
