<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Así lo ve Tu Tienda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,500..700&amp;family=Figtree:wght@400;600;700;800&amp;family=Caveat:wght@700&amp;display=swap">
<style>
body{margin:0}
@media (prefers-reduced-motion: reduce){ .dz-mueve{transition:none !important} }
</style>
</helmet>
<div class="dz-mueve" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{fondo}}; color: {{tinta}}; font-family: Figtree, system-ui, sans-serif; transition: background 600ms ease, color 600ms ease">
  <span style="position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-family: Caveat, cursive; font-weight: 700; font-size: 30px; color: {{acento}}">{{antes}}</span>

  <img class="dz-mueve" src="/_blob/240205398567a7e0d585a4580ddc6312" alt="Icono de quien compra" style="position: absolute; top: 250px; left: {{xRosa}}; width: {{tamRosa}}; height: {{tamRosa}}; border-radius: 28%; box-shadow: 0 18px 30px -16px rgba(0,0,0,.5); transition: left 700ms cubic-bezier(.2,.8,.2,1), width 700ms cubic-bezier(.2,.8,.2,1), height 700ms cubic-bezier(.2,.8,.2,1), top 700ms; z-index: {{zRosa}}">
  <img class="dz-mueve" src="/_blob/fe3362f5f08a400dfafabb95c8655132" alt="Icono de la tienda" style="position: absolute; top: 250px; left: {{xVerde}}; width: {{tamVerde}}; height: {{tamVerde}}; border-radius: 28%; box-shadow: 0 18px 30px -16px rgba(0,0,0,.5); transition: left 700ms cubic-bezier(.2,.8,.2,1), width 700ms cubic-bezier(.2,.8,.2,1), height 700ms cubic-bezier(.2,.8,.2,1); z-index: {{zVerde}}">

  <div style="position: absolute; left: 24px; right: 24px; top: 440px; text-align: center; display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-family: Fredoka, sans-serif; font-stretch: 108%; font-weight: 700; font-size: 38px; line-height: 1.05">{{titulo}}</h2>
    <p style="margin: 0; font-size: 16.5px; line-height: 1.4; font-weight: 600; opacity: .9">{{texto}}</p>
  </div>

  <button type="button" onClick="{{cambiar}}" style="position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); height: 52px; padding: 0 24px; border: 0; border-radius: 999px; background: {{botonFondo}}; color: {{botonTinta}}; font-family: Figtree, sans-serif; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>
    {{boton}}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tienda: false }; }
  renderVals() {
    const t = this.state.tienda;
    return {
      fondo: t ? '#174B3A' : '#F5C9D6',
      tinta: t ? '#FFF9EE' : '#174B3A',
      acento: t ? '#F5C9D6' : '#C24E18',
      antes: t ? 'y del otro lado…' : 'así lo vio quien compra',
      titulo: t ? 'Así lo ve Tu Tienda.' : 'Pidió en segundos.',
      texto: t ? 'El pedido te llega completo: qué quiere, cuánto y a quién se lo mandas.' : 'Eligió, le dio aaah y te mandó el pedido por WhatsApp.',
      xRosa: t ? '226px' : '125px', tamRosa: t ? '96px' : '140px', zRosa: t ? 1 : 2,
      xVerde: t ? '125px' : '68px', tamVerde: t ? '140px' : '96px', zVerde: t ? 2 : 1,
      botonFondo: t ? '#F5C9D6' : '#174B3A',
      botonTinta: t ? '#174B3A' : '#FFF9EE',
      boton: t ? 'Volver a quien compra' : 'Ver el lado de la tienda',
      cambiar: () => this.setState({ tienda: !t })
    };
  }
}
</script>
</body>
</html>
