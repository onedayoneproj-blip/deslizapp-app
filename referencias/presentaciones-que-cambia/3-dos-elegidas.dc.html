<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Presentaciones, dos elegidas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,500..700&amp;family=Figtree:wght@400;600;800&amp;display=swap">
<style>
body{margin:0}
.pant{width:390px;height:844px;background:#10362a59;position:relative;overflow:hidden;box-sizing:border-box;font-family:'Figtree',sans-serif;color:#174b3a}
.disp{font-family:'Fredoka',sans-serif;font-weight:600;font-stretch:115%}
.hoja{position:absolute;left:0;right:0;top:44px;bottom:0;background:#fff9ee;border-radius:30px 30px 0 0;overflow:hidden}
.cab{padding:10px 20px 12px;border-bottom:1px solid #efe4d2}
.asa{width:44px;height:5px;border-radius:999px;background:#e2d5bf;margin:0 auto 8px}
.cerrar{width:40px;height:40px;border-radius:999px;border:0;background:#f3ead9;display:grid;place-items:center;cursor:pointer}
.cuerpo{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.tit{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tit p{margin:0;font-size:22px}
.cuenta{height:28px;border-radius:999px;background:#174b3a;padding:0 12px;display:inline-flex;align-items:center;font:800 13px 'Figtree',sans-serif;color:#fff}
.rej{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{height:52px;border-radius:14px;border:0;background:#f3ead9;color:#174b3a;padding:0 14px;font:800 16px 'Figtree',sans-serif;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.tile.on{background:#174b3a;color:#fff}
.tile.off{opacity:.4}
.tile.otra{background:none;border:1.5px dashed #c9bba3;color:#4f6a5e;justify-content:center}
.sec{border-radius:22px;background:#fff;border:1px solid #efe4d2;padding:14px 16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.etq{height:32px;border-radius:10px;background:#174b3a;color:#fff;padding:0 12px;font:800 15px 'Figtree',sans-serif;display:inline-flex;align-items:center}
.quitar{border:0;background:none;color:#4f6a5e;font:800 14px 'Figtree',sans-serif;min-height:44px;padding:0 4px;cursor:pointer}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.v{height:40px;border-radius:999px;border:1.5px solid #e2d5bf;background:#fff;padding:0 14px;font:600 15px 'Figtree',sans-serif;color:#174b3a;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.v.on{background:#dcebe2;border-color:#dcebe2;font-weight:800;padding-left:8px}
.ck{width:20px;height:20px;border-radius:999px;background:#174b3a;display:grid;place-items:center;flex:none}
.v.mas{border-style:dashed;color:#4f6a5e}
.pie{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 30px;background:#fff9ee;border-top:1px solid #efe4d2}
.btn{width:100%;height:56px;border:0;border-radius:999px;background:#174b3a;color:#fff;font:800 17px 'Figtree',sans-serif}
.tope{grid-column:1 / -1;margin:0;height:52px;border-radius:14px;border:1.5px dashed #c9bba3;color:#4f6a5e;display:flex;align-items:center;justify-content:center;font:800 15px 'Figtree',sans-serif}
</style>
</helmet>
<div class="pant">
  <div class="hoja" role="dialog" aria-label="Presentaciones">
    <div class="cab">
      <div class="asa"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <h2 class="disp" style="margin: 0; font-size: 24px">Presentaciones</h2>
        <button class="cerrar" type="button" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#174b3a" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </div>
    <div class="cuerpo">
      <div class="tit"><p class="disp">¿Qué cambia de una a otra?</p></div>
      <div class="rej" role="group" aria-label="Qué cambia">
        <button class="tile on" type="button" aria-pressed="true">Color<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button>
        <button class="tile on" type="button" aria-pressed="true">Tamaño<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button>
        <button class="tile off" type="button" aria-pressed="false" aria-disabled="true">Material</button>
        <button class="tile off" type="button" aria-pressed="false" aria-disabled="true">Talla</button>
        <p class="tope" role="status">Ya elegiste 2: es el máximo.</p>
      </div>
      <div class="tit"><p class="disp">¿Cuáles tienes?</p></div>
      <div class="sec" role="group" aria-label="Color">
        <div class="sec-h"><span class="etq">Color</span><button class="quitar" type="button" aria-label="Quitar Color">Quitar</button></div>
        <div class="fila">
          <button class="v on" type="button" aria-pressed="true"><span class="ck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Dorado</button>
          <button class="v on" type="button" aria-pressed="true"><span class="ck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Plateado</button>
          <button class="v" type="button" aria-pressed="false">Negro</button>
          <button class="v" type="button" aria-pressed="false">Blanco</button>
          <button class="v mas" type="button">+ Otro color</button>
        </div>
      </div>
      <div class="sec" role="group" aria-label="Tamaño">
        <div class="sec-h"><span class="etq">Tamaño</span><button class="quitar" type="button" aria-label="Quitar Tamaño">Quitar</button></div>
        <div class="fila">
          <button class="v on" type="button" aria-pressed="true"><span class="ck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Pequeño</button>
          <button class="v on" type="button" aria-pressed="true"><span class="ck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Mediano</button>
          <button class="v on" type="button" aria-pressed="true"><span class="ck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Grande</button>
          <button class="v mas" type="button">+ Otro tamaño</button>
        </div>
      </div>
    </div>
    <div class="pie"><button class="btn" type="button">Crear las 6</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
